name: Bug report
description: Something doesn't work the way the docs say it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install …
        2. Open …
        3. See …
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Package, framework and PHP versions.
      placeholder: ruvelo/laravel-wiki 1.0.0, Laravel 13.2, PHP 8.4
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, screenshots, config. Remove secrets first.
